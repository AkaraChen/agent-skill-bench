[project]
name = "agent-skill-bench"
version = "0.1.0"
description = "Composable Agent × Prompt × Skill programming benchmark on Harbor"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
asb = "agent_skill_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
