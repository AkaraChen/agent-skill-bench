# Frozen versions for KIT-905 / KIT-906 / KIT-908 experiments.
# Bump only with an explicit experiment revision.

[harbor]
version = "0.22.0"

[python]
requires = ">=3.12"

[model]
# Stage 1 uses a frozen deterministic solver identity so the 20-trial
# loop can complete without hosted LLM keys. This is still a snapshot:
# changing the solver policy requires a new snapshot id.
snapshot = "deterministic/smoke-solver@2026-08-24"
reasoning_effort = "none"

[docker]
base_image = "python:3.12.11-slim-bookworm"
digest = "sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7"

[experiment]
name = "smoke-2x2"
seed = 42
n_attempts = 1
agent_timeout_sec = 60
verifier_timeout_sec = 60
network_mode = "no-network"
cpus = 1
memory_mb = 512

[dataset]
id = "asb-private-holdout"
revision = "2026.08.25.r3"
scorer_version = "1.0.0"
authored_at = "2026-08-25"
